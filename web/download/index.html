<!DOCTYPE html>

<html lang="zh-cn" class="html">
<head>
	<meta charset="utf-8" />
	<title>下载页咯</title>
	<script src="/src/jquery/jquery-3.6.0.min.js"></script>
	<script src="/src/jquery/jquery.cookie-1.4.1.js"></script>
	<!--<style type="text/css" class="css_a">@import "Web.css";</style>-->
	<link href="style.css" rel="stylesheet" type="text/css"/>
	<script src="main.js"></script>
	<script type="text/javascript">
		$(document).ready(function () {
			// 刷新网页位置
			LayoutRefresh();

			// 解析并获取黄图(doge)
			runJson("/web/download/api/BingWallpaper?format=js&idx=0&n=1&mkt=zh-CN", function (js) {	//自动检测域名替换（憨憨开发时内网需要）& 解析Bing壁纸api Json (划掉......原来不带域名会自动补齐......)
				var data = JSON.parse(js);
				$("#image_c").attr("src", "https://www.bing.com" + data.images[0].url);//转换成Json对象 + 设置黄图(dogePlus)
				$("#image_c").css("opacity", "1");//显示黄图(dogePlusPro)

				//设置黄图介绍(dogePlusProMax)
				var text = data.images[0].copyright;
				var InfoNum = text.indexOf('，');
				if (InfoNum == -1) InfoNum = text.indexOf('(');

				var DecodeText = new Array();
				if (InfoNum == -1)
					DecodeText[0] = text;
				else {
					DecodeText[0] = text.substr(0,(text[InfoNum - 1] == " ") ? InfoNum - 1 : InfoNum);
					DecodeText[1] = text.substr(InfoNum + 1, text.length - InfoNum - 1).replace("(", "").replace(")", "");
				}
				
				$("#BackgroundInfo").html(DecodeText[0] ? DecodeText[0] + "</br>" : "");
				$("#BackgroundInfo").append(DecodeText[1] ? "<a href=" + data.images[0].copyrightlink + " target=\"_blank\">" + DecodeText[1] + "</a>" : "");
			});

			// 获取黄片(dogePlusProMaxUltra)
			runJson(location.protocol + "//" + location.host + "/web/download/api/VideoList.php", function (js) {
				FileList = JSON.parse(js);
				var vl0 = $("#VideoList0");
				var vl1 = $("#VideoList1");
				for (var i = 0; i < FileList.length; i++) {
					if (FileList[i].Type == 1) {
						vl1.append('<li class="l1"><div class="lbox" onclick=\'Play(' + i + ');\'>[电影]<a style="font-weight:600;">' + FileList[i].Name + '</a></div></li>');
					}
					else if(FileList[i].disable != true){
						vl0.append('<li class="l1"><div class="lbox" onclick=\'Play(' + i + ');\'>' + FileList[i].Name + '</div></li>');
					}
				}

				//显示网页元素~
				//$("#ht").css("transition", "400ms ease-in-out");
				$("#table0_1").css("transition", "300ms ease-in-out 100ms");
				$("#table0_2").css("transition", "200ms ease-in-out 200ms");
				setTimeout(function () {
					$("#table0_1,#table0_2").css("opacity", 1);

					$("#WebTitle").css("border-color", "rgb(169 217 102 / 1)");
					$("#WebTitleBox").css({
						"background-color": "rgba(255,255,255,1)",
						"box-shadow": "0px 0px 10px rgba(0, 0, 0, 0.2)"
					});
					$("#WebTitleA").css("color", "var(--text_black)");

					setTimeout(function () {
						$("#table0_1,#table0_2").css("transition", "");

						$("#table0_1Box").css("backdrop-filter", "blur(15px)");
						$("#table0_2BoxLimit").css("backdrop-filter", "blur(10px)");
					}, 400);
				}, 100);

				//检查是否直接播放鸭
				if (window.location.search != "")
					Play(getSearchString('w', window.location.search));
			});

			//定义个事件
			$(window).resize(LayoutRefresh);
			$('html').bind('contextmenu', function () { return false; });
			$("#table0_2Box").hover(function () { t2hover(true) }, function () { t2hover(false) });
			$(".OptSwitch").click(function () { SetSettings(3650) });
			$("#settingsbtnIn , #settingsbtnBack").click(settingsOut);

			//读取Cookies设置康康
			var SettingCookie = $.cookie("Setting");
			if (SettingCookie == null) {
				SetSettings(3650); //如果没有配置的话，就创建一个默认配置呢
				OptionRefresh(Option);
			}
			else
				ReadSettings(JSON.parse(SettingCookie));//Option = JSON.parse(SettingCookie);

			//awa
			console.log("%c\n       ", "font-size:41px;background:url('http://cdn.iknow.bdimg.com/static/common/pkg/module_zed9cd9fd.png') no-repeat -135px -1px");
			console.log("\n%c这是萌萌的小站\n%c一个永远被市尘掩埋的小站\n\n%c（来自 2021 的我）\n", "color:rgb(89,137,229);font-size:12px;font-family:'Microsoft YaHei';", "color:rgb(0,0,0);font-size:12px;font-family:'Microsoft YaHei';", "color:rgb(157,210,90);font-size:12px;font-family:'Microsoft YaHei';");
		});
	</script>
</head>
<body id="body">
	<img id="image_c">
	<canvas id="snow"></canvas>
	<div id="WebTitle">
		<div id="WebTitleBox"><a id="WebTitleA" href="/"><p>下载页面</p></a></div>
	</div>
	<div id="table0">
		<div id="table0_1">
			<div id="table0_1Box">
				<div id="VideoList">
					<ul id="VideoList0"></ul>
					<ul id="VideoList1" style="margin-top:10px"></ul>
				</div>
				<div class="divMask" onclick='settingsOut()'></div>
				<div id="settingsBox">
					<input id="search" />
					<div id="settingsbtn">
						<div class="iconBox">
							<i class="iconfont0" id="settingsbtnIn">&#xe61e;</i>
							<i class="iconfont0" id="settingsbtnBack">&#xe632;</i>
						</div>
					</div>
					<div id="settings">
						<p class="OptH">壁纸</p>
						<div class="OptClass">
							<div class="OptBox" id="BackgroundScaleOpt"><span>背景缩放</span><div class="OptSwitch" onclick='OptionSet("BackgroundScale");'></div></div>
						</div>
						<p class="OptH">性能</p>
						<div class="OptClass">
							<div class="OptBox" id="SnowFallOpt"><span>冬季下雪效果</span><div class="OptSwitch" onclick='OptionSet("SnowFall");'></div></div>
						</div>
						<p class="OptH">播放</p>
						<div class="OptClass">
							<div class="OptBox" id="PlayStopSnowFallOpt"><span>播放自动关闭下雪效果</span><div class="OptSwitch" onclick='OptionSet("PlayStopSnowFall");'></div></div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div id="table0_2">
			<div id="table0_2Box">
				<div id="table0_2BoxLimit">
					<p id="crap">此页面由萌萌制作</p>
					<div id="VideoPlayer">
						<div id="VideoTop"><p id="VideoTitle"></p></div>
						<div id="VideoControlWrap">
							<div id="VideoControl">
								<div id="VideoProgressBarBox">
									<div id="VideoProgressBar">
										<div id="VideoProgressBar0"></div>
										<span id="VideoProgressBarIcon"></span>
									</div>
								</div>
								<div class="PlaySwitch" onclick='PlaySwitch()'></div>
								<div class="PlayTime"><span class="onTime">00:00</span> / <span class="endTime">00:00</span></div>
								<div class="FullscreenSwitch" onclick='PlayerFullscreenSwitch()'></div>
							</div>
						</div>
						<video id="mediabox" onclick="PlaySwitch()"></video>
					</div>
					<!--<iframe frameborder="0" src="VideoModule.html" id="op"></iframe>-->
				</div>
				<div id="BackgroundInfo" class="hidden"><!--在迪纳利国家公园中玩耍的灰熊幼崽，阿拉斯加<br /><a>(© Sean Pavone/iStock/Getty Images Plus) 2021.4.10</a>--></div>
			</div>
		</div>
	</div>
	<!--<script src="Video_Analysis.js"></script>-->
</body>
</html>
